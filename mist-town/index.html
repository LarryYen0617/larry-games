iv id="feedback" aria-live="polite"></div></aside></div><footer><span>☾ 霧鎮檔案室</span><span>V3 · 24 主線 + 自由調查 · <span id="storageStatus"></span></span></footer></main><dialog id="modal"><button class="close" aria-label="關閉">×</button><div id="modalContent"></div></dialog><div class="quickbar" aria-label="調查快捷列"><span id="quickStatus" aria-live="polite"></span><div><button id="jumpPeople">↑ 鎮民證詞</button><button id="jumpNotes">調查手札 ↓</button></div></div><script src="game.js?v=3"></script></body></html>
